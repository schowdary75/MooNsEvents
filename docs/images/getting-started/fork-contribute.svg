<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">External contributor fork and pull request workflow</title>
  <description id="description">Fork MooNsEvents on GitHub, clone your fork, add upstream, create a branch, change and test, push to your fork, open a pull request, and update the same branch after review.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="1" stop-color="#102640" />
    </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0l11 5.5L0 11z" fill="#607b98" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000814" flood-opacity="0.34" />
    </filter>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#background)" />
  <circle cx="1500" cy="60" r="190" fill="#a78bfa" opacity="0.07" />
  <text x="75" y="82" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="42" font-weight="750">External contributor: fork → branch → pull request</text>
  <text x="75" y="124" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="23">You push to your fork. MooNsEvents maintainers review and merge into protected main.</text>

  <g transform="translate(75 160)">
    <rect width="1450" height="56" rx="14" fill="#0c1c30" />
    <text x="28" y="36" fill="#c4b5fd" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">GITHUB</text>
    <text x="220" y="36" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="19">MooNsEvents repository</text>
    <path d="M600 28h290" stroke="#607b98" stroke-width="4" marker-end="url(#arrow)" />
    <text x="960" y="36" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="19">Your GitHub fork</text>
  </g>

  <path d="M255 378h105M650 378h105M1045 378h105" stroke="#607b98" stroke-width="5" marker-end="url(#arrow)" />
  <path d="M1375 490v80M1245 698h-105M850 698H745M455 698H350" stroke="#607b98" stroke-width="5" marker-end="url(#arrow)" />

  <g transform="translate(75 260)" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="#0e2036" stroke="#a78bfa" stroke-width="2" />
    <circle cx="42" cy="42" r="23" fill="#a78bfa" />
    <text x="42" y="50" text-anchor="middle" fill="#140b29" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">1</text>
    <text x="78" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Fork</text>
    <path d="M115 85v50M115 135c0 25-25 20-25 45M115 135c0 25 25 20 25 45M90 85v20M140 85v20" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round" />
    <circle cx="90" cy="82" r="8" fill="#c4b5fd" />
    <circle cx="140" cy="82" r="8" fill="#c4b5fd" />
    <circle cx="90" cy="183" r="8" fill="#c4b5fd" />
    <circle cx="140" cy="183" r="8" fill="#c4b5fd" />
    <text x="22" y="216" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">GitHub: select “Fork”</text>
  </g>

  <g transform="translate(470 260)" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="#0e2036" stroke="#38bdf8" stroke-width="2" />
    <circle cx="42" cy="42" r="23" fill="#38bdf8" />
    <text x="42" y="50" text-anchor="middle" fill="#06121f" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">2</text>
    <text x="78" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Clone fork</text>
    <rect x="25" y="82" width="230" height="85" rx="10" fill="#06121f" />
    <text x="40" y="113" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="14">git clone YOUR-</text>
    <text x="40" y="138" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="14">USERNAME/moonsevents</text>
    <text x="22" y="204" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">origin = your fork</text>
  </g>

  <g transform="translate(865 260)" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="#0e2036" stroke="#38bdf8" stroke-width="2" />
    <circle cx="42" cy="42" r="23" fill="#38bdf8" />
    <text x="42" y="50" text-anchor="middle" fill="#06121f" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">3</text>
    <text x="78" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Add upstream</text>
    <rect x="25" y="82" width="230" height="85" rx="10" fill="#06121f" />
    <text x="40" y="113" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="14">git remote add</text>
    <text x="40" y="138" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="14">upstream ...</text>
    <text x="22" y="204" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">upstream = MooNsEvents</text>
  </g>

  <g transform="translate(1260 260)" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="#0e2036" stroke="#d7df4f" stroke-width="2" />
    <circle cx="42" cy="42" r="23" fill="#d7df4f" />
    <text x="42" y="50" text-anchor="middle" fill="#151802" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">4</text>
    <text x="78" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Branch</text>
    <path d="M95 91v82M95 116h40a23 23 0 0 0 23-23v-2" fill="none" stroke="#e8ef7a" stroke-width="5" stroke-linecap="round" />
    <circle cx="95" cy="90" r="8" fill="#e8ef7a" />
    <circle cx="95" cy="174" r="8" fill="#e8ef7a" />
    <circle cx="158" cy="90" r="8" fill="#e8ef7a" />
    <text x="22" y="204" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">git switch -c fix/name</text>
  </g>

  <g transform="translate(1260 580)" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="#0e2036" stroke="#4ade80" stroke-width="2" />
    <circle cx="42" cy="42" r="23" fill="#4ade80" />
    <text x="42" y="50" text-anchor="middle" fill="#06190f" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">5</text>
    <text x="78" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Change + test</text>
    <g transform="translate(42 82)">
      <rect width="196" height="75" rx="10" fill="#06121f" />
      <path d="M17 25l9 9 17-20M17 52l9 9 17-20" fill="none" stroke="#86efac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="58" y="31" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="15">focused change</text>
      <text x="58" y="58" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="15">checks pass</text>
    </g>
    <text x="22" y="204" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">No secrets or real data</text>
  </g>

  <g transform="translate(865 580)" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="#0e2036" stroke="#38bdf8" stroke-width="2" />
    <circle cx="42" cy="42" r="23" fill="#38bdf8" />
    <text x="42" y="50" text-anchor="middle" fill="#06121f" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">6</text>
    <text x="78" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Push fork</text>
    <rect x="25" y="82" width="230" height="85" rx="10" fill="#06121f" />
    <text x="40" y="113" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="14">git commit ...</text>
    <text x="40" y="138" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="14">git push -u origin</text>
    <text x="22" y="204" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">Your branch, your fork</text>
  </g>

  <g transform="translate(470 580)" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="#0e2036" stroke="#a78bfa" stroke-width="2" />
    <circle cx="42" cy="42" r="23" fill="#a78bfa" />
    <text x="42" y="50" text-anchor="middle" fill="#140b29" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">7</text>
    <text x="78" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Open PR</text>
    <rect x="33" y="84" width="214" height="78" rx="11" fill="#192b42" stroke="#526c87" />
    <rect x="50" y="100" width="82" height="18" rx="6" fill="#a78bfa" />
    <text x="50" y="145" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="15">your fork → main</text>
    <text x="22" y="204" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">Explain + show validation</text>
  </g>

  <g transform="translate(75 580)" filter="url(#shadow)">
    <rect width="280" height="230" rx="20" fill="#0e2036" stroke="#fbbf24" stroke-width="2" />
    <circle cx="42" cy="42" r="23" fill="#fbbf24" />
    <text x="42" y="50" text-anchor="middle" fill="#261900" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">8</text>
    <text x="78" y="50" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="700">Review</text>
    <path d="M64 93h152v64H91l-27 24v-24z" fill="#172a40" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" />
    <path d="M88 114h101M88 135h76" stroke="#fde68a" stroke-width="4" stroke-linecap="round" />
    <text x="22" y="204" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">Push updates to same PR</text>
  </g>

  <text x="800" y="860" text-anchor="middle" fill="#9fb2c8" font-family="Inter, Segoe UI, sans-serif" font-size="19">Protected main changes only after maintainer review and merge.</text>
</svg>
