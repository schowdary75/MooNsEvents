<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">Five checks before pushing a contribution</title>
  <description id="description">Inspect git status, remove sensitive data, run project checks, write a clear commit, and push only a focused feature branch.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="1" stop-color="#102640" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000814" flood-opacity="0.34" />
    </filter>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#background)" />
  <circle cx="90" cy="700" r="210" fill="#4ade80" opacity="0.05" />
  <text x="75" y="82" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="42" font-weight="750">Five checks before every push</text>
  <text x="75" y="124" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="23">A two-minute review prevents most accidental data leaks and noisy pull requests.</text>

  <g transform="translate(55 190)" filter="url(#shadow)">
    <rect width="275" height="355" rx="22" fill="#0e2036" stroke="#38bdf8" stroke-width="2" />
    <circle cx="46" cy="46" r="25" fill="#38bdf8" />
    <text x="46" y="55" text-anchor="middle" fill="#06121f" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800">1</text>
    <text x="86" y="55" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="700">Inspect</text>
    <rect x="28" y="96" width="219" height="94" rx="11" fill="#06121f" />
    <text x="45" y="132" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="17">$ git status</text>
    <text x="45" y="160" fill="#7dd3fc" font-family="JetBrains Mono, Consolas, monospace" font-size="14">review every file</text>
    <text x="28" y="235" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="19">
      <tspan x="28" dy="0">Know exactly what</tspan>
      <tspan x="28" dy="29">will be committed.</tspan>
    </text>
    <text x="28" y="322" fill="#9fb2c8" font-family="Inter, Segoe UI, sans-serif" font-size="17">No unrelated cleanup</text>
  </g>

  <g transform="translate(360 190)" filter="url(#shadow)">
    <rect width="275" height="355" rx="22" fill="#0e2036" stroke="#fb7185" stroke-width="2" />
    <circle cx="46" cy="46" r="25" fill="#fb7185" />
    <text x="46" y="55" text-anchor="middle" fill="#28050c" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800">2</text>
    <text x="86" y="55" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="700">Protect data</text>
    <path d="M100 122v-18a37 37 0 0 1 74 0v18M87 122h100v78H87z" fill="none" stroke="#fda4af" stroke-width="6" stroke-linejoin="round" />
    <circle cx="137" cy="157" r="9" fill="#fda4af" />
    <path d="M137 165v16" stroke="#fda4af" stroke-width="6" stroke-linecap="round" />
    <text x="28" y="235" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="19">
      <tspan x="28" dy="0">No .env, keys, real</tspan>
      <tspan x="28" dy="29">customers, or exports.</tspan>
    </text>
    <text x="28" y="322" fill="#fda4af" font-family="Inter, Segoe UI, sans-serif" font-size="17">Use synthetic screenshots</text>
  </g>

  <g transform="translate(665 190)" filter="url(#shadow)">
    <rect width="275" height="355" rx="22" fill="#0e2036" stroke="#4ade80" stroke-width="2" />
    <circle cx="46" cy="46" r="25" fill="#4ade80" />
    <text x="46" y="55" text-anchor="middle" fill="#06190f" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800">3</text>
    <text x="86" y="55" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="700">Validate</text>
    <path d="M79 115l16 16 33-43M79 168l16 16 33-43" fill="none" stroke="#86efac" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M145 116h65M145 169h48" stroke="#7f96ad" stroke-width="6" stroke-linecap="round" />
    <text x="28" y="235" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="19">
      <tspan x="28" dy="0">Run tests, lint, types,</tspan>
      <tspan x="28" dy="29">format, and secret scan.</tspan>
    </text>
    <text x="28" y="322" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="14">npm run secrets:check</text>
  </g>

  <g transform="translate(970 190)" filter="url(#shadow)">
    <rect width="275" height="355" rx="22" fill="#0e2036" stroke="#d7df4f" stroke-width="2" />
    <circle cx="46" cy="46" r="25" fill="#d7df4f" />
    <text x="46" y="55" text-anchor="middle" fill="#151802" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800">4</text>
    <text x="86" y="55" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="700">Commit</text>
    <rect x="28" y="96" width="219" height="94" rx="11" fill="#06121f" />
    <text x="45" y="126" fill="#e8ef7a" font-family="JetBrains Mono, Consolas, monospace" font-size="15">fix(timeline):</text>
    <text x="45" y="154" fill="#e8ef7a" font-family="JetBrains Mono, Consolas, monospace" font-size="15">preserve stops</text>
    <text x="28" y="235" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="19">
      <tspan x="28" dy="0">Explain the change in</tspan>
      <tspan x="28" dy="29">plain, specific language.</tspan>
    </text>
    <text x="28" y="322" fill="#9fb2c8" font-family="Inter, Segoe UI, sans-serif" font-size="17">One focused purpose</text>
  </g>

  <g transform="translate(1275 190)" filter="url(#shadow)">
    <rect width="275" height="355" rx="22" fill="#0e2036" stroke="#a78bfa" stroke-width="2" />
    <circle cx="46" cy="46" r="25" fill="#a78bfa" />
    <text x="46" y="55" text-anchor="middle" fill="#140b29" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800">5</text>
    <text x="86" y="55" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="700">Push branch</text>
    <path d="M137 95v91M106 126l31-31 31 31" fill="none" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M88 185v19h98v-19" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" />
    <text x="28" y="235" fill="#dce7f3" font-family="Inter, Segoe UI, sans-serif" font-size="19">
      <tspan x="28" dy="0">Push your feature branch,</tspan>
      <tspan x="28" dy="29">then open or update a PR.</tspan>
    </text>
    <text x="28" y="322" fill="#c4b5fd" font-family="Inter, Segoe UI, sans-serif" font-size="17">Never protected main</text>
  </g>

  <g transform="translate(75 600)">
    <rect width="1450" height="70" rx="17" fill="#091a2c" stroke="#29445f" />
    <text x="725" y="44" text-anchor="middle" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="20">If a file looks private or unrelated, stop and ask before pushing.</text>
  </g>
</svg>
