<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title description">
  <title id="title">Trusted collaborator feature branch workflow</title>
  <description id="description">A collaborator with write access clones the main MooNsEvents repository, creates a feature branch, makes and tests a focused change, pushes the branch, opens a pull request, and has it reviewed and squash-merged.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="1" stop-color="#102640" />
    </linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0l11 5.5L0 11z" fill="#607b98" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000814" flood-opacity="0.34" />
    </filter>
  </defs>
  <rect width="1600" height="780" rx="28" fill="url(#background)" />
  <circle cx="1470" cy="40" r="190" fill="#d7df4f" opacity="0.06" />
  <text x="75" y="82" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="42" font-weight="750">Trusted collaborator: clone → feature branch → pull request</text>
  <text x="75" y="124" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="23">Write access lets you push a branch. It does not mean pushing directly to protected main.</text>

  <path d="M300 350h65M600 350h65M900 350h65M1200 350h65" stroke="#607b98" stroke-width="5" marker-end="url(#arrow)" />

  <g transform="translate(45 210)" filter="url(#shadow)">
    <rect width="255" height="280" rx="20" fill="#0e2036" stroke="#38bdf8" stroke-width="2" />
    <circle cx="40" cy="40" r="22" fill="#38bdf8" />
    <text x="40" y="48" text-anchor="middle" fill="#06121f" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="800">1</text>
    <text x="75" y="48" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Clone</text>
    <rect x="22" y="82" width="211" height="84" rx="10" fill="#06121f" />
    <text x="36" y="112" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="13">git clone</text>
    <text x="36" y="138" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="13">schowdary75/...</text>
    <text x="22" y="212" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">origin = MooNsEvents</text>
    <text x="22" y="242" fill="#86efac" font-family="Inter, Segoe UI, sans-serif" font-size="16">Write access required</text>
  </g>

  <g transform="translate(345 210)" filter="url(#shadow)">
    <rect width="255" height="280" rx="20" fill="#0e2036" stroke="#d7df4f" stroke-width="2" />
    <circle cx="40" cy="40" r="22" fill="#d7df4f" />
    <text x="40" y="48" text-anchor="middle" fill="#151802" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="800">2</text>
    <text x="75" y="48" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Branch</text>
    <path d="M91 86v83M91 111h42a23 23 0 0 0 23-23" fill="none" stroke="#e8ef7a" stroke-width="5" stroke-linecap="round" />
    <circle cx="91" cy="85" r="8" fill="#e8ef7a" />
    <circle cx="91" cy="171" r="8" fill="#e8ef7a" />
    <circle cx="156" cy="86" r="8" fill="#e8ef7a" />
    <text x="22" y="212" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">git switch -c</text>
    <text x="22" y="242" fill="#e8ef7a" font-family="JetBrains Mono, Consolas, monospace" font-size="15">feat/short-name</text>
  </g>

  <g transform="translate(645 210)" filter="url(#shadow)">
    <rect width="255" height="280" rx="20" fill="#0e2036" stroke="#4ade80" stroke-width="2" />
    <circle cx="40" cy="40" r="22" fill="#4ade80" />
    <text x="40" y="48" text-anchor="middle" fill="#06190f" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="800">3</text>
    <text x="75" y="48" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Change + test</text>
    <path d="M58 104l13 13 27-33M58 151l13 13 27-33" fill="none" stroke="#86efac" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M116 106h79M116 153h62" stroke="#7f96ad" stroke-width="5" stroke-linecap="round" />
    <text x="22" y="212" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">Focused files only</text>
    <text x="22" y="242" fill="#86efac" font-family="Inter, Segoe UI, sans-serif" font-size="16">Tests + secrets check</text>
  </g>

  <g transform="translate(945 210)" filter="url(#shadow)">
    <rect width="255" height="280" rx="20" fill="#0e2036" stroke="#38bdf8" stroke-width="2" />
    <circle cx="40" cy="40" r="22" fill="#38bdf8" />
    <text x="40" y="48" text-anchor="middle" fill="#06121f" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="800">4</text>
    <text x="75" y="48" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Push branch</text>
    <rect x="22" y="82" width="211" height="84" rx="10" fill="#06121f" />
    <text x="36" y="112" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="13">git commit ...</text>
    <text x="36" y="138" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="13">git push -u origin</text>
    <text x="22" y="212" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">Push feature branch</text>
    <text x="22" y="242" fill="#fda4af" font-family="Inter, Segoe UI, sans-serif" font-size="16">Never force protected main</text>
  </g>

  <g transform="translate(1245 210)" filter="url(#shadow)">
    <rect width="310" height="280" rx="20" fill="#0e2036" stroke="#a78bfa" stroke-width="2" />
    <circle cx="40" cy="40" r="22" fill="#a78bfa" />
    <text x="40" y="48" text-anchor="middle" fill="#140b29" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="800">5</text>
    <text x="75" y="48" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">PR + review</text>
    <rect x="34" y="82" width="242" height="82" rx="11" fill="#192b42" stroke="#526c87" />
    <rect x="52" y="98" width="89" height="18" rx="6" fill="#a78bfa" />
    <path d="M52 136h190" stroke="#7f96ad" stroke-width="5" stroke-linecap="round" />
    <text x="22" y="212" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="17">Review before merge</text>
    <text x="22" y="242" fill="#c4b5fd" font-family="Inter, Segoe UI, sans-serif" font-size="16">Squash into main</text>
  </g>

  <g transform="translate(75 555)">
    <rect width="1450" height="145" rx="20" fill="#091a2c" stroke="#fb7185" stroke-width="2" />
    <circle cx="62" cy="72" r="31" fill="#fb7185" opacity="0.18" />
    <path d="M62 49v29M62 92v3" stroke="#fda4af" stroke-width="6" stroke-linecap="round" />
    <text x="115" y="59" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="700">Protected main is the safety boundary</text>
    <text x="115" y="96" fill="#a9bdd2" font-family="Inter, Segoe UI, sans-serif" font-size="20">Even collaborators use pull requests. Review keeps migrations, credentials, customer data, and production behavior safe.</text>
  </g>
</svg>
